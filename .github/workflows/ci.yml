name: CI

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt -- --check

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: cargo test
        run: cargo test --all-targets --all-features

  release-windows:
    name: Build Windows release artifact
    needs: quality
    runs-on: windows-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.92.0
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo builds
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: Determine version label
        id: describe
        shell: pwsh
        run: |
          $Describe = (git describe --always --dirty).Trim()
          "version=$Describe" | Out-File -FilePath $Env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Build release binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Package artifact
        shell: pwsh
        run: |
          $Binary = "target/x86_64-pc-windows-msvc/release/docsort.exe"
          $OutDir = "dist"
          New-Item -ItemType Directory -Force -Path $OutDir | Out-Null
          Copy-Item $Binary -Destination "$OutDir/docsort.exe"
          $Version = "${{ steps.describe.outputs.version }}"
          $ArchiveName = "docsort-$Version-windows-x86_64.zip"
          $Archive = "$OutDir/$ArchiveName"
          Compress-Archive -Path "$OutDir/docsort.exe" -DestinationPath $Archive -Force

      - name: Publish release asset
        uses: softprops/action-gh-release@v1
        with:
          files: dist/docsort-${{ steps.describe.outputs.version }}-windows-x86_64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
